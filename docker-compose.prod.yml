# Production override — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  backend:
    volumes: []  # No volume mounts in production
    command: null  # Use Dockerfile CMD (uvicorn with --workers)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend  # Override to use final nginx stage (no target)
    volumes: []  # No volume mounts in production
    command: null  # Use Dockerfile CMD (nginx)
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
