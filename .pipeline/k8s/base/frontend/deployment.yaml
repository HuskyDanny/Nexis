apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexis
  labels:
    app: nexis
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexis
      component: frontend
  template:
    metadata:
      labels:
        app: nexis
        component: frontend
    spec:
      containers:
        - name: frontend
          image: nexis-frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
