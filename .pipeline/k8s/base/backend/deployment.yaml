apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexis
  labels:
    app: nexis
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexis
      component: backend
  template:
    metadata:
      labels:
        app: nexis
        component: backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: nexis-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              value: MONGODB_URL_PLACEHOLDER
            - name: REDIS_URL
              value: redis://redis.nexis.svc.cluster.local:6379/0
            - name: ENVIRONMENT
              value: production
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
