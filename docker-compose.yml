services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Neo4j runs as a shared dev instance (see docs/shared-neo4j.md).
    # host.docker.internal lets the backend container reach the host-bound 7690 port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/financial_agent_v2
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://host.docker.internal:7690
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-shared-dev-password}
      OPENAI_API_KEY: ${SILICONFLOW_API_KEY:-}
      OPENAI_BASE_URL: https://api.siliconflow.cn/v1
      ENVIRONMENT: development
    # Dev override: use reload mode
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://backend:8000
    # Dev override: use vite dev server (targets dev stage — deps only, no build)
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Neo4j is no longer a service in this stack — we use the shared dev instance
# started outside docker-compose. See docs/shared-neo4j.md for setup.
# Pre-migration this was: image neo4j:5.26-community on ports 7474/7687,
# APOC plugin, 512m/1G heap, 512m pagecache, password nexis-dev-password.

volumes:
  mongodb_data:
  redis_data:
