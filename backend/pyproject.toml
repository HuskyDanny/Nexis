[project]
name = "financial-agent-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "motor>=3.6",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose>=3.3",
    "bcrypt>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: Benchmark tests (deselect with '-m not benchmark')",
]

[project.optional-dependencies]
dev = ["deepeval>=2.0", "httpx>=0.28", "litellm>=1.0", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=6.0"]
